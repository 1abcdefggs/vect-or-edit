  <!-- Bottom Collapsible System Logs Console Panel -->
  <div id="systemLogPanel" class="system-log-panel" style="display: none;">


    <!-- System Log Output Window -->
    <div style="position: relative; flex: 1; display: flex; flex-direction: column;">
      <div id="logToastStrip" class="log-toast-strip" style="display: none;"></div>
      <div style="position: absolute; top: 8px; right: 12px; display: flex; align-items: stretch; gap: 6px; z-index: 10;">
        <button id="btnClearLogs" data-ui="sys:log-clear" class="log-panel-btn btn-phi"
          style="font-size: var(--fs-12); display: flex; align-items: center; gap: 4px; background: var(--log-btn-bg); border-radius: 4px; border: 1px solid var(--log-btn-border);" data-i18n="btn_clear_logs" data-i18n-title="tip_logs_clear">
          <span class="material-symbols-outlined" style="font-size: var(--fs-14); flex-shrink: 0;">&#xe419;</span>CLEAR
        </button>
        <button id="btnCopyLogs" data-ui="sys:log-copy" class="log-panel-btn btn-phi"
          style="font-size: var(--fs-12); display: flex; align-items: center; gap: 4px; background: var(--log-btn-bg); border-radius: 4px; border: 1px solid var(--log-btn-border);" data-i18n-title="tip_logs_copy">
          <span class="material-symbols-outlined" style="font-size: var(--fs-14); flex-shrink: 0;">&#xe2ec;</span><span data-i18n="btn_copy_logs">Logs COPY</span>
        </button>
        <button id="btnDownloadLogs" data-ui="sys:log-download" class="log-panel-btn btn-phi"
          style="font-size: var(--fs-12); display: flex; align-items: center; gap: 4px; background: var(--log-btn-bg); border-radius: 4px; border: 1px solid var(--log-btn-border);" data-i18n-title="tip_logs_save">
          <span class="material-symbols-outlined" style="font-size: var(--fs-14); flex-shrink: 0;">download</span><span data-i18n="btn_download_logs">Save Logs</span>
        </button>
      </div>
      <div id="logEntriesContainer" class="log-entries-container" style="flex: 1; min-height: 0;"></div>
    </div>
  </div>
