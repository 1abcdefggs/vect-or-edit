  <!-- Bottom Collapsible System Logs Console Panel -->
  <div id="systemLogPanel" class="system-log-panel" style="display: none;">


    <!-- System Log Output Window -->
    <div style="position: relative; flex: 1; display: flex; flex-direction: column;">
      <div style="position: absolute; top: 8px; right: 12px; display: flex; align-items: center; gap: 6px; z-index: 10;">
        <button id="btnClearLogs" class="log-panel-btn"
          style="padding: 2px 8px; font-size: 0.72rem; display: flex; align-items: center; gap: 4px; background: rgba(0,0,0,0.4); border-radius: 4px; border: 1px solid rgba(255,255,255,0.1);" data-i18n="btn_clear_logs">
          <span class="material-symbols-outlined" style="font-size: 0.9rem; flex-shrink: 0;">&#xe419;</span>CLEAR
        </button>
        <button id="btnCopyLogs" class="log-panel-btn"
          style="padding: 2px 8px; font-size: 0.72rem; display: flex; align-items: center; gap: 4px; background: rgba(0,0,0,0.4); border-radius: 4px; border: 1px solid rgba(255,255,255,0.1);">
          <span class="material-symbols-outlined" style="font-size: 0.9rem; flex-shrink: 0;">&#xe2ec;</span><span data-i18n="btn_copy_logs">Logs COPY</span>
        </button>
      </div>
      <div id="logEntriesContainer" class="log-entries-container" style="flex: 1; max-height: 160px;"></div>
    </div>

    <!-- Direct AI Command Console Input Bar (Level 2-C) -->
    <div id="consoleAiInputGroup"
      style="display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--bg-primary); border-top: 1px solid var(--border-color);">
      <span
        style="font-family: var(--font-mono, monospace); font-size: 0.75rem;  color: var(--text-main); display: flex; align-items: center; gap: 4px;">
        <span id="consoleAiStatusBadge"
          style="font-size: 0.65rem; padding: 1px 5px; border-radius: 4px; background: var(--bg-secondary); color: var(--text-main); display: inline-flex; align-items: center; gap: 4px;">
          <span class="material-symbols-outlined" style="font-size: 1.1rem; flex-shrink: 0;">&#xf0f5;</span>
          <span data-i18n="label_ai_direct">AI Direct</span>
        </span>
      </span>
      <input type="text" id="consoleAiInput"
        data-i18n-placeholder="console_ai_placeholder" placeholder="Enter command or natural query... (e.g. /search keyword, /lint, /stats, /clear-slots)"
        style="flex: 1; height: 26px; padding: 0 10px; font-size: 0.75rem; font-family: var(--font-mono, monospace); background: var(--bg-secondary); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 4px; outline: none;">
      <button id="btnConsoleAiRun" class="toolbar-btn"
        style="height: 26px; padding: 0 12px; font-size: 0.72rem; display: flex; align-items: center; background: var(--bg-secondary); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 4px; cursor: pointer;" data-i18n="btn_console_execute">
        <span class="material-symbols-outlined" style="font-size: 1.1rem;">&#xe0b9;</span>Execute
      </button>
    </div>
  </div>
