  <!-- Bottom Collapsible System Logs Console Panel -->
  <div id="systemLogPanel" class="system-log-panel" style="display: none;">


    <!-- System Log Output Window -->
    <div style="position: relative; flex: 1; display: flex; flex-direction: column;">
      <div id="logToastStrip" class="log-toast-strip" style="display: none;"></div>
      <div class="log-head">
        <span data-i18n="log_head_time">Time</span><span data-i18n="log_head_level">Level</span><span data-i18n="log_head_source">Source</span><span data-i18n="log_head_message">Message</span>
        <div class="log-head-actions">
          <button id="btnClearLogs" data-ui="sys:log-clear" class="log-panel-btn btn-phi" data-i18n-title="tip_logs_clear">
            <span class="material-symbols-outlined" aria-hidden="true">&#xe419;</span><span class="log-btn-label" data-i18n="btn_clear_logs">CLEAR</span>
          </button>
          <button id="btnCopyLogs" data-ui="sys:log-copy" class="log-panel-btn btn-phi" data-i18n-title="tip_logs_copy">
            <span class="material-symbols-outlined" aria-hidden="true">&#xe2ec;</span><span class="log-btn-label" data-i18n="btn_copy_logs">Logs COPY</span>
          </button>
          <button id="btnDownloadLogs" data-ui="sys:log-download" class="log-panel-btn btn-phi" data-i18n-title="tip_logs_save">
            <span class="material-symbols-outlined" aria-hidden="true">download</span><span class="log-btn-label" data-i18n="btn_download_logs">Save Logs</span>
          </button>
        </div>
      </div>
      <div id="logEntriesContainer" class="log-entries-container" style="flex: 1; min-height: 0;"></div>
    </div>
  </div>
