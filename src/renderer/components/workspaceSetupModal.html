      <!-- Major/Minor Version Update Notification Modal -->
      <div id="workspaceSetupModal" class="settings-modal-overlay" style="display: none;">
        <div class="settings-modal-dialog" style="width: 480px; height: auto;">
          <div class="modal-header">
            <h2 data-i18n="workspace_setup_title">Set Default Workspace</h2>
          </div>
          <div class="modal-body" style="display: flex; flex-direction: column; gap: 12px; font-size: 0.95rem; color: var(--text-main);">
            <p data-i18n="workspace_setup_desc">To use VectOrEditOr optimally, a default workspace folder is recommended. It will be used to store your knowledge base, generated files, and notes.</p>
            <p><span data-i18n="workspace_setup_prompt_p1">Would you like to automatically create the folder</span> <span>VectOrFoldEr</span> <span data-i18n="workspace_setup_prompt_p2">in your Documents folder?</span></p>
            <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 15px;">
              <button id="btnCreateWorkspace" class="toolbar-btn" style="padding: 10px 16px; border-radius: 4px; background: var(--accent-color, #38bdf8); color: #000; font-weight: bold; width: 100%; text-align: center;" data-i18n="btn_create_workspace_save">Create Workspace & Save (Recommended)</button>
              <button id="btnSaveNormally" class="toolbar-btn" style="padding: 10px 16px; border-radius: 4px; border: 1px solid rgba(56, 189, 248, 0.5); color: var(--accent-color, #38bdf8); width: 100%; text-align: center;" data-i18n="btn_save_normally">Save Normally (No Workspace)</button>
              <button id="btnCancelWorkspace" class="toolbar-btn" style="padding: 8px 16px; border-radius: 4px; border: 1px solid transparent; color: var(--text-muted); width: 100%; text-align: center;" data-i18n="btn_cancel">Cancel</button>
            </div>
          </div>
        </div>
      </div>
