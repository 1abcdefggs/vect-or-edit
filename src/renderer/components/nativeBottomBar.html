<div id="nativeBottomBar" style="height: 24px; background: var(--bg-card); border-top: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 10px; font-size: 0.65rem;">
  
  <div style="display: flex; align-items: center; gap: 8px;">
    <!-- Pipeline Status LEDs removed per user request (kept in systemLogPanel) -->
    <div id="pipelineStatusLedContainer" style="display: none;"></div>

    <button id="btnToggleConsole" class="toolbar-btn semantic-btn-add" data-i18n-title="btn_console" style="height: 20px; padding: 0 6px; display: flex; align-items: center; gap: 4px;">
      <span class="material-symbols-outlined" style="font-size: 1.1rem; flex-shrink: 0;">&#xeb8e;</span>
      <span data-i18n="btn_console">LOGS</span>
      <span id="logCountBadge" style="background: rgba(255,255,255,0.15); padding: 0 4px; border-radius: 4px; font-size: 0.6rem; height: 14px; line-height: 14px; display: flex; align-items: center;">0</span>
    </button>
  </div>

  <div style="display: flex; align-items: center; gap: 8px;">
    <span class="status-bar-item" style="color: var(--text-main); display: flex; align-items: center; gap: 4px;">
      <span class="material-symbols-outlined" style="font-size: 1.1rem; color: var(--text-muted); flex-shrink: 0;">&#xe322;</span>
      <span id="statusMemoryUsage" data-i18n="label_ram">RAM: ~45 MB</span>
    </span>
  </div>
</div>
