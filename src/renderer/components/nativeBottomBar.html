<div id="nativeBottomBar" data-ui="sys:bottom-bar" style="height: 24px; background: var(--bg-card); border-top: var(--border-width) solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 10px; font-size: var(--fs-10);">
  
  <div class="bottom-bar-left" style="display: flex; align-items: center; gap: 8px;">
    <button id="btnToggleConsole" class="toolbar-btn semantic-btn-add" data-i18n-title="btn_console" data-ui="sys:log-console" style="height: 20px; padding: 0 6px; display: flex; align-items: center; gap: 4px;">
      <span class="material-symbols-outlined" style="font-size: var(--fs-18); flex-shrink: 0;">&#xeb8e;</span>
      <span class="bottom-bar-text" data-i18n="btn_console">LOGS</span>
      <span id="logCountBadge" style="background: rgba(255,255,255,0.15); padding: 0 4px; border-radius: 4px; font-size: var(--fs-10); height: 14px; line-height: 14px; display: flex; align-items: center;">0</span>
      <span data-disclosure-icon class="material-symbols-outlined" style="font-size: var(--fs-16); flex-shrink: 0;">&#xe5cf;</span>
    </button>
    <!-- Looks like a button, and its LED shows the worst state of the pipeline while the strip is closed (statusManager.ts) -->
    <button id="btnPipelineToggle" class="toolbar-btn" style="display: none; height: 20px; padding: 0 8px; align-items: center; gap: 6px; border: var(--border-width) solid var(--border-color); border-radius: 4px;" data-i18n-title="tip_pipeline_show">
      <span class="material-symbols-outlined" style="font-size: var(--fs-16);">monitor_heart</span>
      <span class="bottom-bar-text" data-i18n="btn_pipeline">PIPELINE</span>
      <span id="pipelineToggleLed" class="status-led-dot status-loading" aria-hidden="true"></span>
    </button>
    <div id="pipelineStrip" style="display: none; align-items: center; gap: 4px;">
      <!-- Placed where btnPipelineToggle sits so open and close share one position -->
      <button id="btnPipelineClose" class="toolbar-btn" style="display: flex; align-items: center; height: 20px; padding: 0 6px;" data-i18n-title="tip_pipeline_hide">
        <span class="material-symbols-outlined" style="font-size: var(--fs-16);">chevron_left</span>
      </button>

    <!-- Integrated 7-Stage Pipeline Status LED Meter -->
    <div class="system-status-panel" data-ui="sys:pipeline-meter" style="margin: 0; display: flex; align-items: center; gap: 4px;">
      <span class="pipeline-title" style="font-size: var(--fs-10); font-weight: 700; letter-spacing: 0.5px; opacity: 0.8; margin-right: 2px;" data-i18n="log_panel_title">PIPELINE</span>
      <div id="badgeLedConf" class="status-pill" title="1. User Settings: Loading..." data-tip-dynamic="statusManager sets the live status text">
        <span class="status-led-dot status-loading"></span>
        <span class="status-pill-label" style="font-size: var(--fs-10);">1.CONFIG</span>
      </div>
      <span class="flow-arrow"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></span>
      <div id="badgeLedThm" class="status-pill" title="2. Theme Palette: Loading..." data-tip-dynamic="statusManager sets the live status text">
        <span class="status-led-dot status-loading"></span>
        <span class="status-pill-label" style="font-size: var(--fs-10);">2.THEME</span>
      </div>
      <span class="flow-arrow"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></span>
      <div id="badgeLedI18n" class="status-pill" title="3. Locale i18n: Loading..." data-tip-dynamic="statusManager sets the live status text">
        <span class="status-led-dot status-loading"></span>
        <span class="status-pill-label" style="font-size: var(--fs-10);">3.LOCALE</span>
      </div>
      <span class="flow-arrow"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></span>
      <div id="badgeLedMonaco" class="status-pill" title="4. Monaco Editor: Initializing..." data-tip-dynamic="statusManager sets the live status text">
        <span class="status-led-dot status-loading"></span>
        <span class="status-pill-label" style="font-size: var(--fs-10);">4.EDITOR</span>
      </div>
      <span class="flow-arrow"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></span>
      <div id="badgeLedBin" class="status-pill" title="5. Rust Binary (DLL): Initializing..." data-tip-dynamic="statusManager sets the live status text">
        <span class="status-led-dot status-loading"></span>
        <span class="status-pill-label" style="font-size: var(--fs-10);">5.RUST</span>
      </div>
      <span class="flow-arrow"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></span>
      <div id="badgeLedAi" class="status-pill" title="6. AI Embeddings Model: Initializing..." data-tip-dynamic="statusManager sets the live status text">
        <span class="status-led-dot status-loading"></span>
        <span class="status-pill-label" style="font-size: var(--fs-10);">6.AI-MODEL</span>
      </div>
      <span class="flow-arrow"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></span>
      <div id="badgeLedKb" class="status-pill" title="7. Knowledge Base & HNSW: Loading..." data-tip-dynamic="statusManager sets the live status text">
        <span class="status-led-dot status-loading"></span>
        <span class="status-pill-label" style="font-size: var(--fs-10);">7.HNSW</span>
      </div>
    </div>
    </div>

  </div>

  <div class="bottom-bar-right" style="display: flex; align-items: center; gap: 8px;">
    <button id="btnSystemQuickSettings" class="gear-btn gear-btn--sm" data-ui="sys:quick-settings" data-tab-target="tabSystem" data-i18n-title="tip_system_quick_settings">
      <span class="material-symbols-outlined">settings</span>
    </button>
    <div id="updateLedContainer" style="display: none; align-items: center; gap: 4px; color: var(--text-main); cursor: pointer; padding: 2px 6px; border-radius: 4px; background: rgba(0,0,0,0.2);">
      <span id="updateLedIcon" class="material-symbols-outlined" style="font-size: var(--fs-15); line-height: 1;">&#xe86a;</span>
      <span id="updateLedText" class="bottom-bar-text" data-i18n="update_check_label" style="font-size: var(--fs-10);">Check Updates</span>
    </div>

    <span id="statusSaveIndicator" class="status-save-indicator" role="status" aria-live="polite"></span>

    <span class="status-bar-item" data-ui="sys:status-meta" style="color: var(--text-main); display: flex; align-items: center; gap: 4px;">
      <span class="material-symbols-outlined" style="font-size: var(--fs-18); color: var(--text-muted); flex-shrink: 0;">&#xe322;</span>
      <span id="statusMemoryUsage" class="bottom-bar-text" data-i18n="label_ram">RAM: ~45 MB</span>
    </span>
  </div>
</div>
