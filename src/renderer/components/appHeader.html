<header class="app-header">
  <div class="header-left" style="display: flex; align-items: center; gap: 12px;">
    <div class="window-controls-left" style="display: flex; align-items: center; gap: 6px;">
      <img src="./assets/icon.png" alt="VectOrEditOr" class="logo-icon">
      <span style="font-size: 0.75rem; font-weight: 700; letter-spacing: 0.5px;">VectOrEditOr</span>
    </div>
    <!-- Workspace Folder Button (Native Frame) -->
    <button id="btnOpen" class="toolbar-btn"
      style="height: 28px; padding: 0; display: flex; align-items: center; justify-content: center; gap: 4px; flex-shrink: 0; border: none; background: transparent; cursor: pointer; transition: color 0.2s ease; -webkit-app-region: no-drag; color: var(--text-main); white-space: nowrap;"
      data-i18n-title="btn_open"
      onmouseover="this.style.color='var(--accent-color, #38bdf8)'"
      onmouseout="this.style.color='var(--text-main)'">
      <span id="iconFolderClosed" class="material-symbols-outlined" style="font-size: 1.1rem; color: var(--text-main); flex-shrink: 0; display: block;">&#xe2cc;</span>
      <span id="iconFolderOpen" class="material-symbols-outlined" style="font-size: 1.1rem; color: var(--accent-color, #38bdf8); flex-shrink: 0; display: none;">&#xe2cc;</span>
      <span class="icon-label-text" style="font-size: 0.75rem; font-weight: 600;" data-i18n="label_workspace">Workspace</span>
    </button>

    <!-- Master AI Power Switch: Clean borderless style with Active Model Info -->
    <div id="masterAiContainer"
      style="display: flex; align-items: center; gap: 6px; height: 28px; padding: 0; background: transparent; -webkit-app-region: no-drag; border: none; box-shadow: none; flex-shrink: 0;">
      
      <span
        style="font-size: 0.72rem;  color: var(--text-main); display: flex; align-items: center; gap: 4px;">
        <span id="masterAiStatusDot" class="material-symbols-outlined" style="color: #ef4444; font-size: 1.1rem; transition: color 0.3s ease;">&#xe989;</span>
        <span class="icon-label-text" data-i18n="master_ai_label">Master AI</span>
      </span>

      <!-- Seamless ON/OFF Toggle Pill -->
      <div id="masterAiTogglePill" class="master-ai-pill" title="Toggle Master AI" style="flex-shrink: 0;">
        <div class="pill-slider"></div>
        <span class="pill-label pill-off">OFF</span>
        <span class="pill-label pill-on">ON</span>
      </div>

      <div style="width: 1px; height: 14px; background: rgba(255,255,255,0.1); margin: 0 2px;"></div>

      <!-- Model Settings Button -->
      <button id="btnHeaderModelSettings" class="toolbar-btn header-action-btn"
        style="height: 22px; padding: 0 4px; display: flex; align-items: center; justify-content: center; gap: 4px; flex-shrink: 0; border: none; background: transparent; cursor: pointer; white-space: nowrap;"
        data-i18n-title="label_model" title="Select Model">
        <span class="material-symbols-outlined" style="font-size: 1.1rem; color: var(--accent-color, #38bdf8);">&#xf3aa;</span>
        <span class="icon-label-text" style="font-size: 0.72rem; white-space: nowrap;">Model</span>
      </button>
    </div>

  </div>
  <div class="toolbar app-header-toolbar"
    style="display: flex; align-items: center; gap: 5px; flex-shrink: 0; margin-left: auto;">
    
    <div style="width: 1px; height: 14px; background: rgba(255,255,255,0.1); margin: 0 2px;"></div>

    <!-- Global Theme Selector -->
    <div style="display: flex; align-items: center; gap: 2px;">
      <span class="material-symbols-outlined" style="font-size: 1.1rem; color: var(--text-muted);">&#xe40a;</span>
      <select id="themeSelect" class="toolbar-select header-theme-select"
        style="min-width: 100px; height: 26px; font-size: 0.72rem; padding: 1px 26px 1px 8px; flex-shrink: 0; text-overflow: ellipsis; white-space: nowrap;"
        data-i18n-title="label_theme"></select>
    </div>
    
    <!-- Language Toggle -->
    <button id="btnLangToggle" class="toolbar-btn btn-lang-outline"
      style="height: 26px; padding: 0; display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 0.7rem; flex-shrink: 0; border: none; background: transparent;">
      <span class="material-symbols-outlined" style="font-size: 1.1rem; color: var(--accent-color, #38bdf8);">&#xe8e2;</span>
      <span class="icon-label-text" id="langToggleLabel">EN</span>
    </button>
    <!-- Top-level Sidebar Toggle Button -->
    <button id="btnHeaderToggleSidebar" class="toolbar-btn header-action-btn"
      style="width: 28px; height: 26px; padding: 0; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"
      data-i18n-title="btn_toggle_sidebar">
      <span id="headerSidebarToggleIcon" class="material-symbols-outlined" style="font-size: 1.1rem;">&#xf705;</span>
    </button>
    <button id="btnSettings" class="toolbar-btn header-action-btn"
      style="width: 28px; height: 26px; padding: 0; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"
      data-i18n-title="btn_settings">
      <span class="material-symbols-outlined" style="font-size: 1.1rem;">settings</span>
    </button>
  </div>
</header>
<div id="headerFullBorderLine" class="header-full-border-line"></div>
