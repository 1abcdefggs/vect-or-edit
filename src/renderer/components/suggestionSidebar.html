<!-- Dynamic Drag-to-Resize Splitter Bar -->
<div id="sidebarResizer" class="workspace-resizer" title="Drag to resize sidebar"></div>

<!-- Vector Suggestion Sidebar -->
<aside id="suggestionSidebar" class="suggestion-sidebar">
  <div class="sidebar-header">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px;">
      <h3 style="display: flex; align-items: center; gap: 6px; margin: 0; min-width: 0;">
        <!-- Sidebar Child AI Switch -->
        <button id="btnSidebarAiToggle" class="toolbar-btn"
          style="min-height: 24px; padding: 2px 8px; font-size: 0.68rem; font-weight: 700; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.25); color: var(--accent-color, #38bdf8); cursor: pointer; white-space: nowrap; min-width: max-content;"
          data-i18n-title="ai_model_badge_tooltip">
          <span id="activeAiModelStatusDot" style="color: var(--success-color, #10b981); font-size: 0.65rem;">●</span>
          <span id="activeAiModelBadge">SUGGEST AI ON</span>
        </button>
      </h3>
      <div style="display: flex; align-items: center; gap: 6px;">
        <!-- JSON Copy Button: Smartly displayed only when results exist -->
        <button id="btnCopyAllResults" class="toolbar-btn"
          style="display: none; background: rgba(255,255,255,0.08); border: 1px solid var(--border-color); border-radius: 4px; padding: 2px 6px; font-size: 0.72rem; font-weight: 700; color: var(--text-main); align-items: center; gap: 4px; cursor: pointer;"
          data-i18n-title="btn_copy_json">
          <span id="copyAllIcon" style="display: flex; align-items: center;"></span>
          <span data-i18n="btn_copy_json_short">JSON</span>
        </button>
      </div>
    </div>

    <div class="semantic-control-container" style="margin-top: 6px; display: flex; flex-direction: column; gap: 8px;">
      <!-- 1. Guidelines & Presets Section (Active) -->
      <div class="profile-control-card semantic-module-card">
        <div class="semantic-module-header">
          <span class="semantic-module-title">
            <span id="profileIcon" style="display: flex; align-items: center; color: var(--accent-color, #38bdf8);">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                <line x1="9" y1="7" x2="15" y2="7"></line>
                <line x1="9" y1="11" x2="13" y2="11"></line>
              </svg>
            </span>
            <span id="profileHeaderLabel" data-i18n="active_guideline_preset_label">Guideline</span>
          </span>
          <div style="display: flex; align-items: center; gap: 4px;">
            <button id="btnInsertTemplate" class="toolbar-btn"
              style="padding: 2px 7px; font-size: 0.68rem; font-weight: 600; border-radius: 4px; background: rgba(255,255,255,0.06); color: var(--text-main); border: 1px solid var(--border-color);"
              data-i18n-title="btn_insert_template">
              <span data-i18n="btn_insert_template">Template</span>
            </button>
            <button id="btnImportDictionary" class="toolbar-btn semantic-btn-add" data-i18n-title="btn_import_preset">
              <span style="font-size: 0.85rem; font-weight: 900;">＋</span>
              <span data-i18n="btn_import_preset_short">Preset</span>
            </button>
            <button id="btnResetGoal" class="toolbar-btn semantic-btn-clear" style="display: none;"
              data-i18n-title="btn_reset_profile">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="3"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
              <span data-i18n="btn_unload_profile">Unload</span>
            </button>
          </div>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; overflow: hidden;">
          <span id="activeProfileName"
            style="font-size: 0.8rem; font-weight: bold; color: var(--success-color, #10b981); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"
            data-i18n="default_profile">Default Profile (Unrestricted)</span>
          <span id="activeGoalRuleCount" style="font-size: 0.65rem; color: var(--text-muted); flex-shrink: 0;"
            data-i18n="rule_count_zero">0 rules</span>
        </div>
      </div>

      <!-- 2. Knowledge Section -->
      <div class="slots-control-card semantic-module-card">
        <div class="semantic-module-header">
          <span class="semantic-module-title">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent-color, #38bdf8);">
              <path
                d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z" />
            </svg>
            <span data-i18n="knowledge_slots_label">Knowledge</span>
            <span id="knowledgeSlotsCountBadge"
              style="font-size: 0.62rem; padding: 1px 4px; border-radius: 3px; background: rgba(56,189,248,0.12); color: var(--accent-color, #38bdf8); font-weight: 600;" data-i18n="slots_count_zero">0
              Slots</span>
          </span>
          <div style="display: flex; align-items: center; gap: 4px;">
            <button id="btnClearAllSlots" class="toolbar-btn semantic-btn-clear" style="display: none;"
              data-i18n-title="btn_clear_all_slots">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="3"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
              <span data-i18n="btn_clear_slots">Clear</span>
            </button>
            <button id="btnAddSlot" class="toolbar-btn semantic-btn-add" data-i18n-title="btn_add_slot">
              <span style="font-size: 0.85rem; font-weight: 900;">＋</span>
              <span data-i18n="btn_add_slot_short">Slot</span>
            </button>
          </div>
        </div>

        <!-- Dynamic Slots List (SLOT 1, SLOT 2, ...) -->
        <div id="knowledgeSlotsList"
          style="display: flex; flex-direction: column; gap: 4px; max-height: 140px; overflow-y: auto;">
          <div style="font-size: 0.72rem; color: var(--text-muted); padding: 2px 0;"
            data-i18n="slots_empty_placeholder">No knowledge base loaded. Click ＋ Add Slot to load JSON.</div>
        </div>

        <!-- 3. Search Filters: Smartly displayed only when knowledge is loaded -->
        <div id="searchFiltersContainer"
          style="display: none; flex-direction: column; gap: 6px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 6px; margin-top: 2px;">
          <div
            style="display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 0.72rem; color: var(--text-muted);">
            <label style="display: flex; align-items: center; gap: 4px;">
              <span data-i18n="label_min_score">Min:</span>
              <input type="number" id="numMinScore" min="50" max="99" value="70"
                style="width: 42px; background: var(--bg-secondary); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 4px; padding: 2px 4px; font-size: 0.72rem;">%
            </label>
            <label style="display: flex; align-items: center; gap: 4px;">
              <span data-i18n="label_limit">Limit:</span>
              <select id="selSearchLimit"
                style="background: var(--bg-secondary); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 4px; padding: 2px 4px; font-size: 0.72rem;">
                <option value="5" selected>5</option>
                <option value="10">10</option>
                <option value="20">20</option>
              </select>
            </label>
          </div>

          <!-- Embedder Path Setting -->
          <div
            style="display: flex; flex-direction: column; gap: 4px; padding-top: 4px; border-top: 1px solid rgba(255,255,255,0.05);">
            <div>
              <div style="font-size: 0.72rem; color: var(--text-main); font-weight: 600;"
                data-i18n="setting_embedder_path">Embedder Path</div>
              <div style="font-size: 0.65rem; color: var(--text-muted); line-height: 1.2;"
                data-i18n="setting_embedder_path_desc">Embedding Module Path</div>
            </div>
            <input id="sidebarEmbedderPathInput" type="text" placeholder="../../vect-or-data/embedder.mjs"
              style="width: 100%; box-sizing: border-box; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 4px; padding: 4px 6px; font-size: 0.7rem; color: var(--text-main);" />
          </div>
          <label
            style="display: flex; align-items: center; gap: 4px; font-size: 0.72rem; color: var(--text-muted); cursor: pointer; user-select: none;">
            <input type="checkbox" id="chkShowFullMetadata"
              style="accent-color: var(--accent-color, #818cf8); cursor: pointer;">
            <span data-i18n="opt_show_full_metadata">Full Meta</span>
          </label>
        </div>
      </div>
    </div>
  </div>
  <div id="vectorResultsList" class="results-list" style="flex: 1; overflow-y: auto; padding: 6px;"></div>
</aside>
