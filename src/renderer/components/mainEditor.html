<section class="editor-section" style="display: flex; flex-direction: column;">
  <div class="section-title"
    style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 10px;">
    <!-- Center: Editor Header Actions (Save, AutoSave, Typography, Tone) -->
    <div style="display: flex; align-items: center; gap: 6px; flex: 1;">
      <!-- Integrated File Save Group -->
      <div class="font-control-integrated-group save-dropdown-container" style="display: flex; align-items: center; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 0 4px; height: 30px; position: relative;">
        
        <style>
          .save-dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            z-index: 100;
            flex-direction: column;
            min-width: 110px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            padding: 4px 0;
            margin-top: 4px;
          }
          .save-dropdown-container:hover .save-dropdown-menu {
            display: flex;
          }
          .save-dropdown-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: transparent;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            width: 100%;
            text-align: left;
            font-size: 0.75rem;
          }
          .save-dropdown-item:hover {
            background: var(--bg-hover);
          }
          .save-dropdown-item.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
          }
        </style>

        <!-- Combined Save & AutoSave Button -->
        <button id="btnSave" class="editor-header-btn" style="height: 28px; background: transparent; border: none; padding: 0 4px 0 8px; display: flex; align-items: center; gap: 6px; border-radius: 4px; cursor: pointer; color: var(--text-main); white-space: nowrap;" data-i18n-title="btn_save">
          <input type="checkbox" id="chkAutoSaveToggle" style="accent-color: var(--accent-color, #38bdf8); cursor: pointer;" title="Toggle AutoSave">
          <span class="material-symbols-outlined" style="font-size: 1.1rem; flex-shrink: 0; color: var(--accent-color, #38bdf8);">&#xe161;</span>
          <span class="icon-label-text" style="font-size: 0.72rem; font-weight: 600;" data-i18n="btn_save">Save</span>
          <span class="material-symbols-outlined" style="font-size: 1.2rem; margin-left: -4px;">arrow_drop_down</span>
        </button>

        <div class="save-dropdown-menu">
          <button id="btnSaveAs" class="save-dropdown-item" data-i18n-title="btn_save_as" title="Save As...">
            <span class="material-symbols-outlined" style="font-size: 1.1rem;">&#xeb60;</span>
            <span data-i18n="btn_save_as">Save As</span>
          </button>
          <button id="btnSaveAll" class="save-dropdown-item disabled" data-i18n-title="btn_save_all" title="Save All">
            <span class="material-symbols-outlined" style="font-size: 1.1rem;">&#xf774;</span>
            <span data-i18n="btn_save_all">Saves</span>
          </button>
        </div>
      </div>
      
      <span style="display: inline-block; width: 1px; height: 16px; background: var(--border-color); opacity: 0.7; margin: 0 4px;"></span>

      <!-- Editor Tone -->
      <div class="font-control-integrated-group" style="display: flex; align-items: center; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 0 4px; height: 30px;">
        <span class="material-symbols-outlined" style="font-size: 1.1rem; color: var(--text-muted); margin-right: 2px;">&#xe41d;</span>
        <select id="quickEditorToneSelect" class="editor-toolbar-select" style="max-width: 125px; height: 28px; border: none; background: transparent;"
          data-i18n-title="setting_editor_bg">
          <option value="default" selected data-i18n="tone_default">Tone: Default</option>
          <option value="dark_oled" data-i18n="tone_dark_oled">Dark: OLED Black</option>
          <option value="dark_obsidian" data-i18n="tone_dark_obsidian">Dark: Obsidian</option>
          <option value="dark_charcoal" data-i18n="tone_dark_charcoal">Dark: Charcoal</option>
          <option value="dark_slate" data-i18n="tone_dark_slate">Dark: Slate</option>
        </select>
      </div>

      <!-- Typography Group (Font Family + Font Size) -->
      <div class="font-control-integrated-group"
        style="display: flex; align-items: center; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 0 4px; height: 30px;">
        <span class="material-symbols-outlined" style="font-size: 1.1rem; color: var(--text-muted); margin-right: 2px;">&#xe165;</span>
        <select id="fontFamilySelect" class="editor-toolbar-select"
          style="border: none; background: transparent; height: 28px; padding: 0 16px 0 2px;">
          <option value="'Source Serif 4', 'Noto Serif JP', Georgia, 'Times New Roman', serif"
            data-i18n="font_serif">Source Serif 4</option>
          <option
            value="'Source Sans 3', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            data-i18n="font_sans_serif">Source Sans 3</option>
          <option value="'Source Code Pro', 'Cascadia Code', Consolas, Monaco, monospace" data-i18n="font_mono">
            Source Code Pro</option>
        </select>
        <span
          style="display: inline-block; width: 1px; height: 14px; background: var(--border-color); opacity: 0.6; margin: 0 2px;"></span>
        <select id="fontSizeSelect" class="editor-toolbar-select"
          style="border: none; background: transparent; height: 28px; max-width: 85px; padding: 0 16px 0 2px;">
          <option value="14" data-i18n="font_small">14px</option>
          <option value="16" selected data-i18n="font_normal">16px</option>
          <option value="18" data-i18n="font_large">18px</option>
          <option value="20" data-i18n="font_xlarge">20px</option>
        </select>
      </div>

      <!-- Markdown Copy/Paste Group -->
      <div class="font-control-integrated-group" style="display: flex; align-items: center; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 0 4px; height: 30px;">
        <button id="btnMarkdownCopy" class="editor-header-btn" style="height: 28px; background: transparent; border: none; padding: 0 8px; display: flex; align-items: center; gap: 4px; border-radius: 4px; cursor: pointer; color: var(--text-main); white-space: nowrap;" title="Copy as Markdown">
          <span class="material-symbols-outlined" style="font-size: 1.1rem; color: #818cf8; flex-shrink: 0;">&#xf553;</span>
          <span class="icon-label-text" style="font-size: 0.72rem;">Copy</span>
        </button>
        <span style="display: inline-block; width: 1px; height: 14px; background: var(--border-color); opacity: 0.6; margin: 0 2px;"></span>
        <button id="btnMarkdownPaste" class="editor-header-btn" style="height: 28px; background: transparent; border: none; padding: 0 8px; display: flex; align-items: center; gap: 4px; border-radius: 4px; cursor: pointer; color: var(--text-main); white-space: nowrap;" title="Paste Markdown">
          <span class="material-symbols-outlined" style="font-size: 1.1rem; color: #818cf8; flex-shrink: 0;">&#xf554;</span>
          <span class="icon-label-text" style="font-size: 0.72rem;">Paste</span>
        </button>
      </div>

      <!-- Right: Editor AI Toggle Chip Button (matching Sidebar AI component) -->
      <button id="btnEditorAiToggle" class="toolbar-btn"
        style="height: 28px; padding: 2px 10px; font-size: 0.70rem; font-weight: 700; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.25); color: var(--accent-color, #38bdf8); cursor: pointer; white-space: nowrap; transition: all 0.25s ease;"
        data-i18n-title="ai_model_badge_tooltip">
        <span id="editorAiStatusDot" style="color: #ef4444; font-size: 0.65rem; transition: color 0.3s ease;">●</span>
        <span id="editorAiLabel" data-i18n="editor_ai_off">Editor AI OFF</span>
      </button>

      <div id="quickCustomColorGroup" style="display: none; align-items: center; gap: 4px;">
        <input type="color" id="quickCustomBgPicker" value="#1e1e2e" data-i18n-title="label_bg"
          style="width: 22px; height: 22px; padding: 0; border: 1px solid var(--border-color); border-radius: 4px; cursor: pointer; background: transparent;">
        <input type="color" id="quickCustomFgPicker" value="#cdd6f4" data-i18n-title="label_text"
          style="width: 22px; height: 22px; padding: 0; border: 1px solid var(--border-color); border-radius: 4px; cursor: pointer; background: transparent;">
      </div>
    </div>

    <!-- Right: Vector Generation Assist -->
    <div class="editor-header-right" style="display: flex; align-items: center; gap: 6px; flex-shrink: 0;">
      <!-- Editor AI is now handled in the center group -->
    </div>
  </div>
  <!-- Chrome-style Multi-Document Tab Bar -->
  <div class="editor-tab-bar" id="editorTabBar" style="display: flex; align-items: center; background: var(--bg-card); border-bottom: 1px solid var(--border-color);">
    <div class="editor-tabs-list" id="editorTabsList" style="flex: 1; display: flex; align-items: center; overflow-x: auto;"></div>
    <button id="btnDuplicateTab" class="toolbar-btn" style="height: 28px; width: 28px; padding: 0; display: flex; align-items: center; justify-content: center; border: none; background: transparent; color: var(--text-muted); cursor: pointer; flex-shrink: 0;" title="Duplicate Tab">
      <span class="material-symbols-outlined" style="font-size: 1.2rem;">&#xf744;</span>
    </button>
  </div>
  <div id="monacoContainer" style="display: block; width: 100%; flex: 1; min-height: 0;"></div>
  <!-- Editor Status Bar: Clean minimal design without redundant doc name / autosave -->
  <div class="editor-status-bar" id="editorStatusBar">
    <div class="status-bar-left">
      <span id="statusCharCount" class="status-bar-item">0 chars</span>
      <span class="status-bar-separator">|</span>
      <span id="statusLineCount" class="status-bar-item">1 lines</span>
    </div>
    <div class="status-bar-right" style="display: flex; align-items: center; gap: 6px;">
      <span class="status-bar-item">UTF-8</span>
      <span class="status-bar-separator">|</span>
      <span class="status-bar-item" style="display: flex; align-items: center; gap: 4px;">
        <span class="material-symbols-outlined" style="font-size: 1rem; color: #818cf8;">&#xf552;</span>
        <span>Markdown</span>
      </span>
    </div>
  </div>
</section>
