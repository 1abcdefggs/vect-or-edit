<div id="aiSetupModalOverlay" class="modal-overlay" style="display: none; z-index: 10000; position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); align-items: center; justify-content: center;">
  <div class="settings-modal-dialog" style="width: 540px; height: auto; max-height: 90vh; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); box-shadow: 0 10px 40px rgba(0,0,0,0.5); display: flex; flex-direction: column;">
    
    <div style="padding: 24px 32px 16px; border-bottom: 1px solid var(--border-color); text-align: center;">
      <h2 style="margin: 0; font-size: 1.4rem; color: var(--text-main);  display: flex; align-items: center; justify-content: center; gap: 8px;" data-i18n="ai_setup_title">
        AI Engine Setup
      </h2>
      <p style="margin: 8px 0 0; font-size: 0.85rem; color: var(--text-muted);" data-i18n="ai_setup_subtitle">Select the AI to enable VectOrEditOr semantic search</p>
    </div>

    <div style="padding: 24px 32px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px;">
      
      <!-- Option A: Local AI -->
      <label class="setting-item" style="cursor: pointer; border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 16px; display: flex; align-items: flex-start; gap: 12px; background: var(--bg-secondary); transition: all 0.2s ease;">
        <input type="radio" name="ai_setup_provider" value="local" checked style="margin-top: 4px;">
        <div style="flex: 1;">
          <div style=" font-size: 0.95rem; color: var(--text-main); margin-bottom: 4px; display: flex; align-items: center; gap: 6px;">
            <span data-i18n="ai_setup_local_title">Local AI Model</span>
            <span style="font-size: 0.65rem; padding: 2px 6px; background: var(--accent-color); color: #fff; border-radius: 4px;" data-i18n="ai_setup_recommended">Recommended</span>
          </div>
          <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 12px; line-height: 1.4;">
            <span data-i18n="ai_setup_local_desc1">Runs completely offline with zero risk of data leakage. Model download required on first use. (Downloaded to app cache)</span>
            <br>
            <span style="font-size: 0.75rem; color: var(--text-muted); opacity: 0.8;" data-i18n="ai_setup_local_desc2">* Can be changed later in settings. A dedicated page for searching and downloading other AI models is planned.</span>
          </div>
          <div id="aiSetupLocalOptions" style="display: flex; flex-direction: column; gap: 8px;">
            <select id="aiSetupLocalModel" class="toolbar-input" size="3" style="width: 100%; padding: 6px; background: var(--bg-main); color: var(--text-main); border: 1px solid var(--border-color); border-radius: var(--radius-sm); overflow: hidden;">
              <option value="Xenova/multilingual-e5-small" data-i18n="ai_setup_model_e5">multilingual-e5-small (45MB / Lightweight & Fast)</option>
              <option value="Xenova/bge-small-en-v1.5" data-i18n="ai_setup_model_bge">bge-small-en (45MB / English only, high accuracy)</option>
              <option value="nomic-ai/nomic-embed-text-v1.5" data-i18n="ai_setup_model_nomic">nomic-embed-text (137MB / High accuracy)</option>
            </select>
          </div>
        </div>
      </label>

      <!-- Option B: Cloud API -->
      <label class="setting-item" style="cursor: pointer; border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 16px; display: flex; align-items: flex-start; gap: 12px; background: var(--bg-main); transition: all 0.2s ease;">
        <input type="radio" name="ai_setup_provider" value="cloud" style="margin-top: 4px;">
        <div style="flex: 1;">
          <div style=" font-size: 0.95rem; color: var(--text-main); margin-bottom: 4px; display: flex; align-items: center; gap: 6px;" data-i18n="ai_setup_cloud_title">
            Cloud / External API
          </div>
          <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 12px; line-height: 1.4;" data-i18n="ai_setup_cloud_desc">
            Use Gemini, OpenAI, Claude, or other open-source/external APIs. High reasoning capability with zero PC resource consumption. (API key required)
          </div>
          <div id="aiSetupCloudOptions" style="display: none; flex-direction: column; gap: 8px;">
            <select id="aiSetupCloudProvider" class="toolbar-input" style="width: 100%; padding: 6px; background: var(--bg-main); color: var(--text-main); border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
              <option value="gemini">Google Gemini</option>
              <option value="openai">OpenAI</option>
              <option value="claude">Anthropic Claude</option>
            </select>
            <input type="password" id="aiSetupCloudKey" class="toolbar-input" placeholder="Enter API Key..." data-i18n-placeholder="ai_setup_api_key_placeholder" style="width: 100%; padding: 6px; background: var(--bg-main); color: var(--text-main); border: 1px solid var(--border-color); border-radius: var(--radius-sm); box-sizing: border-box;">
          </div>
        </div>
      </label>

      <!-- Option C: None -->
      <label class="setting-item" style="cursor: pointer; border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 12px 16px; display: flex; align-items: flex-start; gap: 12px; background: var(--bg-main); transition: all 0.2s ease;">
        <input type="radio" name="ai_setup_provider" value="none" style="margin-top: 4px;">
        <div style="flex: 1;">
          <div style=" font-size: 0.95rem; color: var(--text-main); margin-bottom: 4px;" data-i18n="ai_setup_none_title">
            No AI (Keyword Search Only)
          </div>
          <div style="font-size: 0.8rem; color: var(--text-muted);" data-i18n="ai_setup_none_desc">Use only fast exact-match and dictionary search without AI.</div>
        </div>
      </label>

    </div>

    <!-- Progress Area -->
    <div id="aiSetupProgressArea" style="display: none; padding: 0 32px 16px;">
      <div style="font-size: 0.75rem; color: var(--accent-color); margin-bottom: 4px; display: flex; justify-content: space-between;">
        <span id="aiSetupProgressText" data-i18n="ai_setup_downloading">Downloading model...</span>
        <span id="aiSetupProgressPct">0%</span>
      </div>
      <div style="width: 100%; height: 4px; background: var(--border-color); border-radius: 2px; overflow: hidden;">
        <div id="aiSetupProgressBar" style="width: 0%; height: 100%; background: var(--accent-color); transition: width 0.2s ease;"></div>
      </div>
    </div>

    <div style="padding: 16px 32px 24px; border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end; gap: 12px;">
      <button id="btnAiSetupCancel" class="btn" style="padding: 6px 16px;" data-i18n="btn_cancel">Cancel</button>
      <button id="btnAiSetupSave" class="btn primary" style="padding: 6px 24px;" data-i18n="btn_save_start">Save & Start</button>
    </div>
  </div>
</div>
