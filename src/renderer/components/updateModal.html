  <div id="updateModal" class="settings-modal-overlay" style="display: none;">
    <div class="settings-modal-dialog" style="width: 520px; height: auto; max-height: 80vh;">
      <div class="modal-header">
        <div style="display: flex; align-items: center; gap: 8px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent-color, #38bdf8)"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
            <polyline points="17 6 23 6 23 12"></polyline>
          </svg>
          <span class="modal-title" data-i18n="update_available_title">New Update Available</span>
        </div>
        <button id="btnCloseUpdateModal" class="toolbar-btn" style="padding: 4px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="settings-modal-body" style="display: flex; flex-direction: column; gap: 14px; padding: 20px 24px;">
        <div
          style="display: flex; align-items: center; justify-content: space-between; background: rgba(56, 189, 248, 0.08); border: 1px solid rgba(56, 189, 248, 0.2); padding: 10px 14px; border-radius: 8px;">
          <div>
            <div style="font-size: 0.72rem; color: var(--text-muted);" data-i18n="label_current_version">Current Version
            </div>
            <div id="updateCurrentVersion" style="font-size: 0.95rem; font-weight: 700; color: var(--text-main);">v0.2.0
            </div>
          </div>
          <div style="font-size: 1.2rem; color: var(--accent-color, #38bdf8);">➜</div>
          <div>
            <div style="font-size: 0.72rem; color: var(--text-muted);" data-i18n="label_latest_version">Latest Version
            </div>
            <div id="updateLatestVersion"
              style="font-size: 0.95rem; font-weight: 700; color: var(--accent-color, #38bdf8);">v0.3.0</div>
          </div>
        </div>

        <div>
          <div style="font-size: 0.8rem; font-weight: 700; margin-bottom: 6px; color: var(--text-main);"
            data-i18n="label_whats_new">What's New in this Release:</div>
          <div id="updateChangelog"
            style="font-size: 0.78rem; color: var(--text-muted); background: var(--bg-primary); padding: 12px; border-radius: 6px; border: 1px solid var(--border-color); max-height: 140px; overflow-y: auto; line-height: 1.5; white-space: pre-wrap;">
            - Enhanced Rust N-API Engine and Offline Vector Search
            - Unified System Log Stream and Theme Token Refactoring
            - Direct Text & Markdown Export from Monaco Editor
          </div>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px;">
          <button id="btnRemindLater" class="toolbar-btn"
            style="padding: 8px 14px; border-radius: 6px; font-weight: 600;" data-i18n="btn_remind_later">Remind Me
            Later</button>
          <button id="btnOpenRelease" class="toolbar-btn"
            style="padding: 8px 16px; background: var(--accent-color, #38bdf8); color: #000; font-weight: 700; border-radius: 6px;"
            data-i18n="btn_view_release">View Release / Update</button>
        </div>
      </div>
    </div>
  </div>
