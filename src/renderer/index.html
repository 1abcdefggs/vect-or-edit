<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- CSP: scripts only from the app itself (no inline handlers, no eval; WebAssembly allowed for the ONNX runtime).
       Inline styles stay allowed: the templates use style attributes throughout. -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' data: blob: https://api.github.com https://huggingface.co https://*.huggingface.co https://cdn-lfs.huggingface.co https://cdn-lfs-us-1.huggingface.co ws://localhost:* http://localhost:*; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-src 'none'">
  <title data-i18n="app_title">VectOrEdit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cascadia+Code:wght@400;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;600;700&family=Source+Code+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap"
    rel="stylesheet">
  <!-- Google Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css">
  <style>
    /* Critical initial styling to prevent FOUC / blank flash during startup */
    html, body {
      background-color: var(--app-backdrop, #080c16);
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100vh;
      color: #cdd6f4;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .app-container {
      opacity: 1;
      transition: opacity 0.15s ease;
    }
  </style>
</head>

<body>
  <div id="appStartupLoader" class="app-startup-loader" role="status" aria-live="polite">
    <div class="startup-logo-row">
      <div class="startup-logo" aria-hidden="true">
        <span style="--i:0">V</span><span style="--i:1">e</span><span style="--i:2">c</span><span style="--i:3">t</span><span style="--i:4">O</span><span style="--i:5">r</span><span style="--i:6">E</span><span style="--i:7">d</span><span style="--i:8">i</span><span style="--i:9">t</span>
      </div>
      <span id="startupVersionBadge" class="startup-loader-version" aria-hidden="true"></span>
    </div>
    <div class="neural-glow-line startup-loader-line" aria-hidden="true"></div>
    <div id="loaderStatusText" class="startup-loader-status" data-i18n="loader_initializing">Initializing Monaco &amp; Core Engine...</div>
  </div>
  <div class="app-container">
    <!-- Header injected here by uiLoader -->

    <!-- Main Workspace -->
    <div class="workspace-wrapper" style="flex: 1; display: flex; flex-direction: column; min-height: 0;">
      <main class="workspace">
        <!-- Editor Area and Sidebar injected here by uiLoader -->
      </main>
    </div>

    <!-- Native Frame Bottom Bar injected here by uiLoader -->
  </div>

    <!-- Injected Components (workspaceSetupModal, updateModal) will appear here -->
  <script type="module" src="./renderer.ts"></script>
</body>

</html>
