name: Build and Release Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  # Reads @1abcdefggs/vect-or-engine from GitHub Packages (npm install)
  packages: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci
        env:
          # .npmrc reads this token for the @1abcdefggs scope on GitHub Packages
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Application Bundle
        run: npm run build
        env:
          VECTOR_SHARED_APP_SECRET: ${{ secrets.VECTOR_SHARED_APP_SECRET }}

      - name: Build Windows Installer (.exe)
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VECTOR_SHARED_APP_SECRET: ${{ secrets.VECTOR_SHARED_APP_SECRET }}

      - name: Upload Installer to Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
