name: Build and Release Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # package.json depends on file:../vect-or-engine, so the engine must sit next to this
      # repository. checkout cannot write outside the workspace, so it goes to a subfolder first.
      - name: Checkout engine source
        uses: actions/checkout@v4
        with:
          repository: 1abcdefggs/vect-or-engine
          ref: main
          path: engine-src

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js 24 (engine requires >= 24)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build engine (.node)
        shell: pwsh
        run: |
          Move-Item engine-src ..\vect-or-engine
          Push-Location ..\vect-or-engine
          npm ci
          npm run build
          Pop-Location

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Application Bundle
        run: npm run build
        env:
          VECTOR_SHARED_APP_SECRET: ${{ secrets.VECTOR_SHARED_APP_SECRET }}

      - name: Build Windows Installer (.exe)
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VECTOR_SHARED_APP_SECRET: ${{ secrets.VECTOR_SHARED_APP_SECRET }}

      - name: Upload Installer to Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
