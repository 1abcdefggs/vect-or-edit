[package]
name = "vect-or-engine-napi"
version = "0.1.0"
edition = "2024"
authors = ["Gemini Code Assist"]

[lib]
crate-type = ["cdylib"]

[dependencies]
# NAPI-rs for Node.js bindings
napi = { version = "2", features = ["napi4", "tokio_rt"] }
napi-derive = "2"

# State management and serialization
once_cell = "1.19"
serde_json = "1"
# Internal engine library
vect_or_engine_lib = { path = ".." }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true