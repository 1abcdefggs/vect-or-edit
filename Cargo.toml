[package]
name = "vect-or-engine-napi"
version = "0.1.0"
edition = "2021"
authors = ["1abcdefggs"]
description = "rust napi module for vect-or-engine"
license = "MIT"
keywords = ["rust", "napi", "vect-or-engine"]
categories = ["development-tools::debugger", "development-tools::profiling"]
repository = "https://github.com/1abcdefggs/vect-or-engine-napi"
readme = "README.md"

[lib]
crate-type = ["cdylib"] # Required for N-API modules
path = "lib.rs"         # Explicitly specify the library entry point

[dependencies]
# NAPI-rs for Node.js bindings
napi = { version = "2", features = ["napi4", "tokio_rt", "serde-json"] }
napi-derive = "2"

# State management and serialization
once_cell = "1.19"
serde_json = "1"
# Tokio for async runtime features used by the N-API layer
tokio = { version = "1", features = ["sync"] }
# Internal engine library (correct path from vect-or-edit to vect-or-engine)
vect_or_engine_lib = { path = "../vect-or-engine" }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
